# Builds the static site and publishes it to GitHub Pages on every push to main.
# Live at https://bernante.github.io/PatrickBernante-Portfolio/
# (Repo Settings -> Pages -> Source must be "GitHub Actions".)
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never run two deploys at once; a newer push cancels an older one in progress.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build static site
        run: npm run build
        env:
          # Pages serves this repo from a sub-folder named after the repo.
          NEXT_PUBLIC_BASE_PATH: /${{ github.event.repository.name }}

      # Copies Next's nested prefetch files to the flat names browsers request,
      # which a static host cannot map on its own (see the script for details).
      - name: Fix prefetch file names
        run: node scripts/flatten-prefetch.mjs out

      # Stops GitHub from running Jekyll, which would hide the _next folder.
      - name: Disable Jekyll
        run: touch out/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
